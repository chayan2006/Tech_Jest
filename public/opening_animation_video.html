<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TECH JEST | Ideas Today, Solutions Tomorrow</title>
  <style>
    /* --- RESET & BASE STYLES --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #050714; /* Deep midnight blue/black matching the video */
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Lock scrolling while the intro animation is playing */
    body.intro-active {
      overflow: hidden;
    }

    /* --- INTRO SPLASH SCREEN --- */
    #intro-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #050714;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s;
    }

    /* Class triggered via JS when video finishes or is skipped */
    #intro-loader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #intro-video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Ensures full-screen coverage without black bars */
    }

    /* --- SKIP INTRO BUTTON --- */
    #skip-btn {
      position: absolute;
      bottom: 40px;
      right: 40px;
      padding: 10px 24px;
      background: rgba(5, 12, 36, 0.65);
      color: #00d2ff;
      border: 1px solid rgba(0, 210, 255, 0.4);
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.3s ease;
      z-index: 10000;
    }

    #skip-btn:hover {
      background: rgba(0, 210, 255, 0.2);
      border-color: #00d2ff;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
      transform: translateY(-2px);
    }

    /* --- MAIN WEBSITE CONTENT --- */
    #main-content {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      background: radial-gradient(circle at center, #0d1638 0%, #050714 75%);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.2s ease 0.3s, transform 1.2s ease 0.3s;
    }

    /* Reveal main website smoothly */
    body.loaded #main-content {
      opacity: 1;
      transform: translateY(0);
    }

    .brand-title {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 800;
      letter-spacing: 6px;
      background: linear-gradient(90deg, #e0e6ed 0%, #ffffff 45%, #00d2ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    .tagline {
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      color: #8fa3c7;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }

    .cta-button {
      padding: 14px 36px;
      background: linear-gradient(135deg, #0066ff 0%, #00d2ff 100%);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 1.5px;
      border-radius: 30px;
      box-shadow: 0 4px 25px rgba(0, 210, 255, 0.35);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .cta-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 30px rgba(0, 210, 255, 0.6);
    }

    .replay-btn {
      margin-top: 1.5rem;
      background: transparent;
      border: 1px solid rgba(143, 163, 199, 0.3);
      color: #8fa3c7;
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .replay-btn:hover {
      border-color: #00d2ff;
      color: #00d2ff;
    }
  </style>
</head>
<body class="intro-active">

  <!-- OPENING ANIMATION OVERLAY -->
  <div id="intro-loader">
    <!-- 
      muted + playsinline are required by modern browsers (Chrome, Safari, iOS) 
      to allow videos to autoplay without user interaction.
    -->
    <video id="intro-video" autoplay muted playsinline preload="auto">
      <source src="/opening_animation_video.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>
    
    <button id="skip-btn">Skip Intro</button>
  </div>

  <!-- MAIN WEBSITE HERO SECTION -->
  <main id="main-content">
    <h1 class="brand-title">TECH JEST</h1>
    <p class="tagline">Ideas Today &nbsp;|&nbsp; Solutions Tomorrow</p>
    <a href="/" class="cta-button">EXPLORE SOLUTIONS</a>
    <button id="replay-btn" class="replay-btn" type="button">Replay Intro Animation</button>
  </main>

  <script>
    const introLoader = document.getElementById('intro-loader');
    const introVideo = document.getElementById('intro-video');
    const skipBtn = document.getElementById('skip-btn');
    const replayBtn = document.getElementById('replay-btn');

    // Function to transition from the video intro to the main site
    function revealWebsite() {
      if (introLoader.classList.contains('fade-out')) return; // Prevent double trigger

      introLoader.classList.add('fade-out');
      document.body.classList.remove('intro-active');
      document.body.classList.add('loaded');

      // Pause video and remove overlay from display after fade finishes to save memory
      setTimeout(() => {
        try { introVideo.pause(); } catch(e){}
        introLoader.style.display = 'none';
      }, 1200);
    }

    function replayIntro() {
      introLoader.style.display = 'flex';
      introLoader.classList.remove('fade-out');
      document.body.classList.add('intro-active');
      document.body.classList.remove('loaded');
      try {
        introVideo.currentTime = 0;
        introVideo.play().catch(revealWebsite);
      } catch(e) {
        revealWebsite();
      }
    }

    // 1. Automatically transition when the video ends
    introVideo.addEventListener('ended', revealWebsite);

    // 2. Allow the user to skip the intro manually
    skipBtn.addEventListener('click', revealWebsite);

    // 3. Fallback: If the video file fails to load or autoplay is blocked, reveal the site
    introVideo.addEventListener('error', revealWebsite);

    if (replayBtn) {
      replayBtn.addEventListener('click', replayIntro);
    }

    // Safety fallback timer (14 seconds) in case the video stalls on a slow connection
    setTimeout(revealWebsite, 14000);
  </script>

</body>
</html>
